<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Taller</title>

<!-- PWA: hace que el navegador ofrezca "Instalar app" (queda como un ícono
     propio, sin barra de direcciones, como Gmail o Facebook en el celular).
     Ver manifest.json y sw.js — este último es lo que además permite que la
     app ABRA sin conexión en vez de mostrar el error del navegador; el
     manejo de que los DATOS sigan funcionando sin red vive aparte, en
     core/guardado.js y core/store.js (ver el comentario al inicio de sw.js). -->
<link rel="manifest" href="manifest.json">
<!-- Sin "media": se actualiza a mano según el tema que la app tenga activo
     (ver render()/"toggle-tema" en core/dom.js) — así el color de la barra
     del sistema sigue al tema que el usuario ELIGIÓ adentro, no al del
     sistema operativo, que puede no coincidir. -->
<meta name="theme-color" id="meta-theme-color" content="#0e1015">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<!-- iOS no lee el manifest para el ícono de "Agregar a inicio": necesita este
     link aparte, en PNG (no sirve un SVG ni el manifest.json de arriba). -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Registro del service worker: aislado, sin dependencias de core/app.js —
  // si falla (navegador viejo, bloqueado por una extensión) no afecta en
  // nada al resto de la app, solo se queda sin caché offline.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) {
        console.error("No se pudo activar el modo sin conexión (la app sigue funcionando igual, solo sin caché offline)", e);
      });
    });
  }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- crossorigin: sin esto la respuesta llega "opaque" (type:'opaque',
     status:0, ok:false) aunque el request funcione perfecto, y sw.js nunca
     la cachea porque su guard mira res.ok — la fuente quedaba sin caché
     offline pese a estar en la whitelist de sw.js. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">

<!-- Generador de PDF de cotizaciones (Cotizaciones → "Generar PDF para el cliente").
     Scripts clásicos (no ES module): quedan disponibles como window.jspdf.
     crossorigin: mismo motivo que el <link> de fonts de arriba — sin esto
     sw.js no puede cachear estos scripts para que el PDF/Excel/gráficas
     sigan funcionando sin conexión. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>

<!-- Lectura de Excel (.xlsx) real — importar la plantilla de tallas ya
     diligenciada en Cotizaciones. Script clásico: queda disponible como
     window.XLSX. La edición comunitaria de SheetJS no escribe estilos de
     celda (se pierden al generar el archivo), así que la DESCARGA de la
     plantilla (con el encabezado con color) usa ExcelJS en su lugar, ver
     abajo. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>

<!-- Generación de Excel (.xlsx) CON estilo (color de encabezado, igual al de
     las tablas de los PDF) — plantilla descargable de tallas en
     Cotizaciones. Script clásico: queda disponible como window.ExcelJS. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" crossorigin="anonymous"></script>

<!-- Gráficas del panel Resumen (Chart.js). Script clásico: queda disponible
     como window.Chart. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" crossorigin="anonymous"></script>

<!-- Login con Google (core/auth.js). Script clásico: expone window.google. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Arrastrar y soltar para reordenar (insumos de una referencia, en
     Cotizaciones). SortableJS en vez de mecánica propia con el API nativo de
     drag-and-drop: soporte real por touch de fábrica (el nativo no lo tiene
     de forma confiable) y evita reinventar algo que esta librería ya
     resuelve bien. Script clásico: expone window.Sortable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.7/Sortable.min.js" crossorigin="anonymous"></script>

<!-- CSS modular: variables primero, luego base/layout, luego por área de negocio.
     El orden importa poco (las clases no se pisan entre archivos), pero mantenerlo
     así facilita ubicar cada regla. -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/help.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/pedidos.css">
<link rel="stylesheet" href="css/cotizaciones.css">
<link rel="stylesheet" href="css/catalogo.css">
<link rel="stylesheet" href="css/productos.css">
<link rel="stylesheet" href="css/plantillas.css">
<link rel="stylesheet" href="css/clientes.css">
<link rel="stylesheet" href="css/pendientes.css">
<link rel="stylesheet" href="css/config.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/atajos.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app"><div class="empty">Cargando tu panel…</div></div>

<!-- type="module" habilita import/export nativo del navegador: no se necesita
     bundler ni paso de compilación para trabajar con el código dividido en js/. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
